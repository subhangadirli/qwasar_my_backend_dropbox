version: 1
backend:
  phases:
    build:
      commands:
        # Use `npm install` (not `npm ci`): the AWS SDK dependency tree pulls in
        # @opentelemetry/core@2.0.0 in a way npm's strict `ci` check rejects even
        # for a freshly generated lockfile, so `install` reconciles it at build time.
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
